<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffe56a">
  <title>日文卡圖鑑</title>
  <style>
    :root {
      --ink: #24180a;
      --muted: #4a3a22;
      --paper: #fff8e7;
      --accent: #c9a227;
      --card: #fffdf6;
      --line: #d8c89a;
      --pad: max(1rem, env(safe-area-inset-left));
      --pad-r: max(1rem, env(safe-area-inset-right));
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 "Noto Sans TC", "PingFang TC", "Noto Sans CJK TC", sans-serif; background: var(--paper); color: var(--ink); padding-bottom: env(safe-area-inset-bottom); }
    body.ditto { --paper: #f4eef8; --accent: #9a7bb8; --line: #c9b5d8; background: #f4eef8; }
    body.ditto header { background: linear-gradient(#e4d2f0, #f4eef8); }
    a { color: #5c3d00; }
    body.ditto a { color: #4a2d68; }
    nav { display: flex; gap: .5rem; padding: .75rem var(--pad-r) 0 var(--pad); flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    nav a { flex: 0 0 auto; text-decoration: none; padding: .45rem .85rem; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-weight: 700; min-height: 44px; display: inline-flex; align-items: center; }
    nav a.on { background: var(--accent); color: #24180a; border-color: transparent; }
    header { display: grid; grid-template-columns: 120px 1fr; gap: 1rem; align-items: center; padding: 1rem var(--pad-r) 1.1rem var(--pad); background: linear-gradient(#ffe56a, var(--paper)); }
    header img { width: 120px; }
    h1 { margin: 0 0 .3rem; font-size: 1.55rem; line-height: 1.25; }
    .meta, .flavor, .hint, .count, article small, a.pick small { color: var(--muted); }
    .meta { font-weight: 700; font-size: .92rem; }
    .flavor { margin: .35rem 0 0; max-width: 40rem; }
    .hint { margin: .45rem 0 0; font-size: .95rem; max-width: 40rem; }
    .stats { display: flex; flex-wrap: wrap; gap: .35rem; margin: .5rem 0 0; }
    .stats span { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: .1rem .55rem; font-size: .8rem; color: var(--ink); }
    .toolbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; padding: 0 var(--pad-r) .85rem var(--pad); }
    .toolbar[hidden] { display: none !important; }
    .sync { align-items: stretch; }
    .sync label { display: flex; align-items: center; gap: .4rem; font-weight: 700; }
    input, select, button { padding: .55rem .7rem; border: 1px solid #c9b57a; border-radius: 8px; background: #fff; font: inherit; color: var(--ink); min-height: 44px; }
    input[type=search] { flex: 1 1 12rem; min-width: 0; }
    #sync-code { width: 8.6rem; letter-spacing: .08em; text-transform: lowercase; font-weight: 700; }
    button { cursor: pointer; font-weight: 700; }
    .count { margin-left: auto; font-size: .92rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: .85rem; padding: 0 var(--pad-r) 3rem var(--pad); }
    article, a.pick { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: .55rem; }
    article.owned { outline: 3px solid var(--accent); }
    article img, a.pick img { width: 100%; object-fit: contain; background: #efe6c8; border-radius: 6px; }
    article img { aspect-ratio: 63/88; filter: grayscale(1); }
    article.owned img { filter: none; }
    article h2, a.pick h2 { margin: .4rem 0 0; font-size: .95rem; color: var(--ink); }
    article small, a.pick small { display: block; margin-top: .15rem; font-size: .78rem; line-height: 1.35; }
    a.pick { text-decoration: none; color: inherit; display: block; min-height: 44px; }
    a.pick img { aspect-ratio: 1; }
    .zoom { display: block; width: 100%; padding: 0; border: 0; background: none; min-height: 0; border-radius: 6px; }
    .mark { width: 100%; margin-top: .45rem; }
    article.owned .mark { background: var(--accent); border-color: transparent; }
    dialog { border: 0; padding: 0; background: transparent; max-width: none; max-height: none; }
    dialog::backdrop { background: rgba(20, 12, 4, .86); }
    dialog .sheet { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .75rem; padding: 1rem; }
    dialog img { max-width: min(92vw, 420px); max-height: 78dvh; width: auto; height: auto; border-radius: 10px; background: #111; }
    dialog .cap { margin: 0; color: #f6edd4; text-align: center; font-weight: 700; }
    dialog .sub { margin: 0; color: #d8c89a; text-align: center; font-size: .9rem; }
    dialog menu { margin: 0; padding: 0; }
    @media (max-width: 720px) {
      header { grid-template-columns: 72px 1fr; gap: .7rem; padding-top: .75rem; }
      header img { width: 72px; }
      h1 { font-size: 1.28rem; }
      .flavor, .stats { display: none; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: .65rem; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .count { margin-left: 0; }
      .sync { flex-direction: column; }
      .sync label { width: 100%; }
      #sync-code { flex: 1; width: auto; }
      input, select, button { width: 100%; }
      dialog img { max-width: 96vw; max-height: 72dvh; }
    }
  </style>
</head>
<body>
  <nav id="nav"></nav>
  <header>
    <img id="art" alt="">
    <div>
      <div class="meta" id="meta"></div>
      <h1 id="title"></h1>
      <p class="flavor" id="source"></p>
      <p class="flavor" id="flavor"></p>
      <p class="hint" id="hint"></p>
      <div class="stats" id="stats"></div>
    </div>
  </header>
  <div class="toolbar" id="filters">
    <input type="search" id="q" placeholder="搜名稱或系列" aria-label="搜尋">
    <select id="kind" aria-label="篩選">
      <option value="">全部</option>
      <option value="missing">未收藏</option>
      <option value="owned">已收藏</option>
    </select>
    <span class="count" id="count"></span>
  </div>
  <div class="toolbar sync">
    <label>同步碼 <input id="sync-code" maxlength="8" spellcheck="false" autocomplete="off" inputmode="text" aria-label="同步碼"></label>
    <button type="button" id="sync-copy">複製</button>
    <button type="button" id="sync-go">用此碼載入</button>
    <span class="count" id="sync-status"></span>
  </div>
  <main class="grid" id="grid"></main>
  <dialog id="zoom" aria-label="放大卡圖">
    <div class="sheet">
      <img id="zoom-img" alt="">
      <p class="cap" id="zoom-cap"></p>
      <p class="sub" id="zoom-sub"></p>
      <menu><button type="button" id="zoom-close">關閉</button></menu>
    </div>
  </dialog>
  <script>
    const pages = {
      psyduck: {
        num: 54, json: "data/cards.json", key: "psyduck-owned", label: "可達鴨",
        title: "可達鴨",
        names: "#054 · コダック / Psyduck",
        src: "https://www.tcgcollector.com/pokedex/54/psyduck/jp?releaseDateOrder=newToOld&displayAs=images&pokemonCardCountMode=allCardVariants",
        srcLabel: "資料來源：TCG Collector 日文",
      },
      ditto: {
        num: 132, json: "data/ditto.json", key: "ditto-owned", label: "百變怪",
        title: "百變怪",
        names: "#132 · メタモン / Ditto",
        src: "https://www.tcgcollector.com/pokedex/132/ditto/jp?releaseDateOrder=newToOld&displayAs=images&pokemonCardCountMode=allCardVariants",
        srcLabel: "資料來源：TCG Collector 日文",
      },
    };
    const q = new URLSearchParams(location.search).get("p");
    const slug = pages[q] ? q : (/ditto/i.test(location.pathname) ? "ditto" : "");
    const dex = slug ? pages[slug] : null;
    document.body.classList.toggle("ditto", slug === "ditto");
    document.getElementById("nav").innerHTML =
      `<a href="index.html"${slug ? "" : " class=\"on\""}>主頁</a>` +
      Object.entries(pages).map(([k, p]) => `<a href="?p=${k}"${slug === k ? " class=\"on\"" : ""}>${p.label}</a>`).join("");

    const CODE_RE = /^[a-z0-9]{8}$/;
    const CODE_KEY = "dex-sync-code";
    const abc = "abcdefghijklmnopqrstuvwxyz0123456789";
    const newCode = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), (n) => abc[n % 36]).join("");
    let syncCode = localStorage.getItem(CODE_KEY);
    if (!CODE_RE.test(syncCode || "")) {
      syncCode = newCode();
      localStorage.setItem(CODE_KEY, syncCode);
    }
    document.getElementById("sync-code").value = syncCode;
    const status = (t) => { document.getElementById("sync-status").textContent = t; };
    const localPair = () => ({
      psyduck: JSON.parse(localStorage.getItem("psyduck-owned") || "[]"),
      ditto: JSON.parse(localStorage.getItem("ditto-owned") || "[]"),
    });
    const applyPair = (data) => {
      localStorage.setItem("psyduck-owned", JSON.stringify(data.psyduck || []));
      localStorage.setItem("ditto-owned", JSON.stringify(data.ditto || []));
      if (dex) {
        owned.clear();
        for (const id of JSON.parse(localStorage.getItem(dex.key) || "[]")) owned.add(id);
      }
    };
    const cloudFail = () => status(/^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? "本機預覽不能同步" : "同步失敗");
    const cloudPut = () => fetch("/api/sync?code=" + syncCode, {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(localPair()),
    }).then((r) => { if (r.ok) status("已同步到雲端"); else cloudFail(); }).catch(cloudFail);
    const cloudGet = (replaceEmpty) => fetch("/api/sync?code=" + syncCode).then(async (r) => {
      if (!r.ok) { cloudFail(); return; }
      const data = await r.json();
      const n = (data.psyduck || []).length + (data.ditto || []).length;
      const loc = localPair();
      if (n || replaceEmpty) applyPair({ psyduck: data.psyduck || [], ditto: data.ditto || [] });
      else if (loc.psyduck.length + loc.ditto.length) await cloudPut();
      else status("已連接雲端");
      if (n) status("已從雲端載入");
    }).catch(cloudFail);
    document.getElementById("sync-copy").onclick = () => navigator.clipboard.writeText(syncCode).then(() => status("已複製同步碼")).catch(() => status(syncCode));
    document.getElementById("sync-go").onclick = () => {
      const next = document.getElementById("sync-code").value.toLowerCase().trim();
      if (!CODE_RE.test(next)) { status("要 8 個小寫英數"); return; }
      syncCode = next;
      localStorage.setItem(CODE_KEY, syncCode);
      document.getElementById("sync-code").value = syncCode;
      cloudGet(true).then(() => { if (dex) render(); else home(); });
    };
    document.getElementById("sync-code").addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("sync-go").click(); });

    const dlg = document.getElementById("zoom");
    const openZoom = (src, cap, sub) => {
      document.getElementById("zoom-img").src = src;
      document.getElementById("zoom-img").alt = cap;
      document.getElementById("zoom-cap").textContent = cap;
      document.getElementById("zoom-sub").textContent = sub;
      dlg.showModal();
    };
    document.getElementById("zoom-close").onclick = () => dlg.close();
    dlg.addEventListener("click", (e) => { if (e.target === dlg || e.target.classList.contains("sheet")) dlg.close(); });

    const owned = new Set(dex ? JSON.parse(localStorage.getItem(dex.key) || "[]") : []);
    let cards = [];
    let saveTimer;
    const save = () => {
      localStorage.setItem(dex.key, JSON.stringify([...owned]));
      clearTimeout(saveTimer);
      saveTimer = setTimeout(cloudPut, 400);
    };

    function home() {
      document.title = "日文卡圖鑑";
      document.getElementById("art").src = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/54.png";
      document.getElementById("art").alt = "日文卡圖鑑";
      document.getElementById("meta").textContent = "日文卡圖鑑";
      document.getElementById("title").textContent = "選擇圖鑑";
      document.getElementById("source").textContent = "";
      document.getElementById("flavor").textContent = "";
      document.getElementById("hint").textContent = "記低Collection既同步碼!";
      document.getElementById("filters").hidden = true;
      Promise.all(Object.entries(pages).map(([k, p]) =>
        fetch(p.json).then((r) => r.json()).then((list) => ({ k, p, n: list.length }))
      )).then((rows) => {
        document.getElementById("grid").innerHTML = rows.map(({ k, p, n }) => {
          const have = JSON.parse(localStorage.getItem(p.key) || "[]").length;
          return `<a class="pick" href="?p=${k}">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p.num}.png" alt="${p.label}">
            <h2>${p.label}</h2>
            <small>已收藏 ${have} / ${n}</small>
          </a>`;
        }).join("");
      });
      cloudGet(false);
    }

    function render() {
      const qv = document.getElementById("q").value.trim().toLowerCase();
      const kind = document.getElementById("kind").value;
      const list = cards.filter((c) => {
        if (kind === "owned" && !owned.has(c.id)) return false;
        if (kind === "missing" && owned.has(c.id)) return false;
        if (!qv) return true;
        return [c.name, c.nameJa, c.set].join(" ").toLowerCase().includes(qv);
      });
      document.getElementById("count").textContent = `已收藏 ${owned.size} / ${cards.length}`;
      document.getElementById("grid").innerHTML = list.map((c) => {
        const on = owned.has(c.id);
        return `<article class="${on ? "owned" : ""}" data-id="${c.id}" data-image="${c.image}" data-name="${(c.nameJa || c.name).replace(/"/g, "")}" data-set="${c.set.replace(/"/g, "")}">
          <button type="button" class="zoom" aria-label="放大卡圖"><img src="${c.image}" alt="${c.nameJa || c.name}" loading="lazy"></button>
          <h2>${c.nameJa || c.name}</h2>
          <small>${c.set}</small>
          <button type="button" class="mark">${on ? "已收藏" : "未收藏"}</button>
        </article>`;
      }).join("");
    }

    if (!dex) {
      home();
    } else {
      document.title = dex.title + "日文卡圖鑑";
      document.getElementById("art").src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${dex.num}.png`;
      document.getElementById("art").alt = dex.title;
      document.getElementById("meta").textContent = dex.names;
      document.getElementById("title").textContent = dex.title;
      document.getElementById("source").innerHTML = `<a href="${dex.src}" target="_blank" rel="noreferrer">${dex.srcLabel}</a>`;
      document.getElementById("flavor").textContent = "載入中…";
      document.getElementById("hint").textContent = "撳卡圖放大。撳「未收藏」變成已收藏。灰階＝未有；彩色＝已有。有 holo／reverse 先分開列。";
      document.getElementById("q").addEventListener("input", render);
      document.getElementById("kind").addEventListener("change", render);
      document.getElementById("grid").addEventListener("click", (e) => {
        const art = e.target.closest("article");
        if (!art) return;
        if (e.target.closest(".zoom")) {
          openZoom(art.dataset.image, art.dataset.name, art.dataset.set);
          return;
        }
        if (!e.target.closest(".mark")) return;
        const id = art.dataset.id;
        if (owned.has(id)) owned.delete(id); else owned.add(id);
        save();
        render();
      });
      Promise.all([
        fetch(dex.json).then((r) => r.json()),
        fetch(`https://pokeapi.co/api/v2/pokemon/${dex.num}`).then((r) => r.json()),
        fetch(`https://pokeapi.co/api/v2/pokemon-species/${dex.num}`).then((r) => r.json()),
        cloudGet(false),
      ]).then(([list, mon, species]) => {
        cards = list;
        document.getElementById("source").innerHTML = `<a href="${dex.src}" target="_blank" rel="noreferrer">${dex.srcLabel} · ${cards.length} 張</a>`;
        const pick = (lang) => (species.flavor_text_entries.find((f) => f.language.name === lang) || {}).flavor_text;
        document.getElementById("flavor").textContent = (pick("zh-Hant") || pick("zh-Hans") || pick("ja") || pick("en") || "").replace(/\s+/g, " ");
        document.getElementById("stats").innerHTML = mon.stats.map((s) => `<span>${s.stat.name} ${s.base_stat}</span>`).join("");
        render();
      }).catch(() => {
        document.getElementById("flavor").textContent = "";
        document.getElementById("hint").textContent = "讀取失敗：請用瀏覽器打開網站，不要直接雙擊檔案。";
      });
    }
  </script>
</body>
</html>
