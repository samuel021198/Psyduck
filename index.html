<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日文卡圖鑑</title>
  <style>
    :root {
      --ink: #24180a;
      --muted: #4a3a22;
      --paper: #fff8e7;
      --accent: #c9a227;
      --card: #fffdf6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.55 "Noto Sans TC", "PingFang TC", sans-serif; background: var(--paper); color: var(--ink); }
    body.ditto { --paper: #f4eef8; --accent: #9a7bb8; background: #f4eef8; }
    body.ditto header { background: linear-gradient(#e4d2f0, #f4eef8); }
    a { color: #5c3d00; font-weight: 600; }
    body.ditto a { color: #4a2d68; }
    nav { display: flex; gap: .75rem; padding: .85rem 1.5rem 0; }
    nav a { text-decoration: none; padding: .25rem .7rem; border-radius: 999px; border: 1px solid #d4c48a; background: #fff; }
    nav a.on { background: var(--accent); color: #24180a; border-color: transparent; }
    header { display: grid; grid-template-columns: 140px 1fr; gap: 1.1rem; align-items: center; padding: 1rem 1.5rem; background: linear-gradient(#ffe56a, var(--paper)); }
    header img { width: 140px; }
    h1 { margin: 0 0 .35rem; font-size: 1.7rem; }
    .meta, .flavor, .hint, .count, article small { color: var(--muted); }
    .meta { font-weight: 700; }
    .flavor, .hint { max-width: 44rem; }
    .hint { margin: .4rem 0 0; font-size: .92rem; }
    .stats { display: flex; flex-wrap: wrap; gap: .4rem .6rem; margin: .55rem 0 0; }
    .stats span { background: #fff; border: 1px solid #d8c89a; border-radius: 999px; padding: .15rem .6rem; font-size: .85rem; color: var(--ink); }
    .toolbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; padding: 0 1.5rem 1rem; }
    input, select { padding: .45rem .7rem; border: 1px solid #c9b57a; border-radius: 8px; background: #fff; font: inherit; color: var(--ink); }
    input[type=search] { min-width: 14rem; }
    .count { margin-left: auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 1rem; padding: 0 1.5rem 3rem; }
    article { background: var(--card); border: 1px solid #d8c89a; border-radius: 12px; padding: .6rem; cursor: pointer; }
    article.owned { outline: 3px solid var(--accent); }
    article img { width: 100%; aspect-ratio: 63/88; object-fit: contain; background: #efe6c8; border-radius: 6px; filter: grayscale(1); }
    article.owned img { filter: none; }
    article h2 { margin: .45rem 0 0; font-size: .95rem; color: var(--ink); }
    @media (max-width: 640px) { header { grid-template-columns: 1fr; text-align: center; } header img { margin: 0 auto; } }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">可達鴨</a>
    <a href="ditto.html">百變怪</a>
  </nav>
  <header>
    <img id="art" alt="">
    <div>
      <div class="meta" id="meta"></div>
      <h1 id="title"></h1>
      <p class="flavor" id="source"></p>
      <p class="flavor" id="flavor">載入中…</p>
      <p class="hint">灰階＝還沒有。點卡面會亮成彩色，代表你已收藏。再點一次可取消。</p>
      <div class="stats" id="stats"></div>
    </div>
  </header>
  <div class="toolbar">
    <input type="search" id="q" placeholder="搜名稱或系列" aria-label="搜尋">
    <select id="kind">
      <option value="">全部</option>
      <option value="missing">未收藏（灰階）</option>
      <option value="owned">已收藏（彩色）</option>
    </select>
    <span class="count" id="count"></span>
  </div>
  <main class="grid" id="grid"></main>
  <script>
    const pages = {
      psyduck: {
        num: 54, json: "data/cards.json", key: "psyduck-owned",
        title: "可達鴨日文卡圖鑑",
        names: "#054 · 水屬性 · 可達鴨 / コダック / Psyduck",
        src: "https://www.tcgcollector.com/pokedex/54/psyduck/jp?releaseDateOrder=newToOld&displayAs=images&pokemonCardCountMode=anyCardVariant",
        srcLabel: "TCG Collector 日文 #054 · 42 張",
      },
      ditto: {
        num: 132, json: "data/ditto.json", key: "ditto-owned",
        title: "百變怪日文卡圖鑑",
        names: "#132 · 一般屬性 · 百變怪 / メタモン / Ditto",
        src: "https://www.tcgcollector.com/pokedex/132/ditto/jp?releaseDateOrder=newToOld&displayAs=images&pokemonCardCountMode=anyCardVariant",
        srcLabel: "TCG Collector 日文 #132 · 36 張",
      },
    };
    const slug = /ditto/i.test(location.pathname + location.search) ? "ditto" : "psyduck";
    const dex = pages[slug];
    document.body.classList.toggle("ditto", slug === "ditto");
    document.title = dex.title;
    document.querySelector(`nav a[href="${slug === "ditto" ? "ditto.html" : "index.html"}"]`).classList.add("on");
    document.getElementById("art").src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${dex.num}.png`;
    document.getElementById("art").alt = dex.title;
    document.getElementById("meta").textContent = dex.names;
    document.getElementById("title").textContent = dex.title;
    document.getElementById("source").innerHTML = `資料：<a href="${dex.src}" target="_blank" rel="noreferrer">${dex.srcLabel}</a>`;

    const owned = new Set(JSON.parse(localStorage.getItem(dex.key) || "[]"));
    let cards = [];
    const save = () => localStorage.setItem(dex.key, JSON.stringify([...owned]));

    function render() {
      const q = document.getElementById("q").value.trim().toLowerCase();
      const kind = document.getElementById("kind").value;
      const list = cards.filter((c) => {
        if (kind === "owned" && !owned.has(c.id)) return false;
        if (kind === "missing" && owned.has(c.id)) return false;
        if (!q) return true;
        return [c.name, c.nameJa, c.set].join(" ").toLowerCase().includes(q);
      });
      document.getElementById("count").textContent = `這頁 ${list.length} 張 · 已收藏 ${owned.size} / ${cards.length}`;
      document.getElementById("grid").innerHTML = list.map((c) => `
        <article class="${owned.has(c.id) ? "owned" : ""}" data-id="${c.id}" title="${owned.has(c.id) ? "已收藏，再點取消" : "點一下標記已收藏"}">
          <img src="${c.image}" alt="${c.nameJa || c.name}" loading="lazy">
          <h2>${c.nameJa || c.name}</h2>
          <small>${c.name} · ${c.set}</small>
        </article>`).join("");
    }

    document.getElementById("q").addEventListener("input", render);
    document.getElementById("kind").addEventListener("change", render);
    document.getElementById("grid").addEventListener("click", (e) => {
      const art = e.target.closest("article");
      if (!art) return;
      const id = art.dataset.id;
      if (owned.has(id)) owned.delete(id); else owned.add(id);
      save();
      render();
    });

    Promise.all([
      fetch(dex.json).then((r) => r.json()),
      fetch(`https://pokeapi.co/api/v2/pokemon/${dex.num}`).then((r) => r.json()),
      fetch(`https://pokeapi.co/api/v2/pokemon-species/${dex.num}`).then((r) => r.json()),
    ]).then(([list, mon, species]) => {
      cards = list;
      const pick = (lang) => (species.flavor_text_entries.find((f) => f.language.name === lang) || {}).flavor_text;
      document.getElementById("flavor").textContent = (pick("zh-Hant") || pick("zh-Hans") || pick("ja") || pick("en") || "").replace(/\s+/g, " ");
      document.getElementById("stats").innerHTML = mon.stats.map((s) => `<span>${s.stat.name} ${s.base_stat}</span>`).join("");
      render();
    }).catch(() => {
      document.getElementById("flavor").textContent = "讀取失敗：請用本機網站開啟，不要直接雙擊檔案。";
    });
  </script>
</body>
</html>
